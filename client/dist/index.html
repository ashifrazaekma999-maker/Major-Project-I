              <h3 className="text-xl font-black mt-1 text-cyan-400">Security Console</h3>
              <div className={`mt-2 text-[11px] text-cyan-400 underline`}>
                IP Intelligence & Cam Feeds
              </div>
            </div>
          </div>

          {/* Chronological Investigation Case History */}
          <div className={`border rounded-2xl overflow-hidden shadow-xl ${cardBg} font-mono text-xs`}>
            <div className={`p-4 border-b ${isDark ? 'border-slate-800' : 'border-slate-200'} flex flex-col md:flex-row md:items-center justify-between gap-3`}>
              <div>
                <h3 className="font-bold text-sm">CHRONOLOGICAL CASE HISTORY & INVESTIGATION LOG</h3>
                <p className={`${textMuted} text-[11px]`}>Real-time FIR lifecycle tracking across central intelligence agencies</p>
              </div>

              {/* Filter Pills & View All */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex bg-slate-950 p-1 rounded-lg border border-slate-800 space-x-1">
                  <button
                    onClick={() => setHistoryFilter('ALL')}
                    className={`px-2.5 py-1 rounded text-[11px] font-bold transition ${
                      historyFilter === 'ALL' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    ALL
                  </button>
                  <button
                    onClick={() => setHistoryFilter('ACTIVE')}
                    className={`px-2.5 py-1 rounded text-[11px] font-bold transition ${
                      historyFilter === 'ACTIVE' ? 'bg-cyan-600 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    🟢 ACTIVE
                  </button>
                  <button
                    onClick={() => setHistoryFilter('PENDING')}
                    className={`px-2.5 py-1 rounded text-[11px] font-bold transition ${
                      historyFilter === 'PENDING' ? 'bg-amber-600 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    🟡 PENDING
                  </button>
                  <button
                    onClick={() => setHistoryFilter('SOLVED')}
                    className={`px-2.5 py-1 rounded text-[11px] font-bold transition ${
                      historyFilter === 'SOLVED' ? 'bg-emerald-600 text-white' : 'text-slate-400 hover:text-white'
                    }`}
                  >
                    🔵 SOLVED
                  </button>
                </div>

                <input
                  type="text"
                  value={historySearch}
                  onChange={e => setHistorySearch(e.target.value)}
                  placeholder="Quick search history..."
                  className="bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1 text-[11px] text-white outline-none w-36 sm:w-44"
                />

                <button
                  onClick={() => { setModalFilter('ALL'); setIsActiveCasesOpen(true); }}
                  className={`px-3 py-1.5 rounded font-bold transition ${
                    isDark ? 'bg-slate-800 hover:bg-slate-700 text-cyan-300' : 'bg-slate-100 hover:bg-slate-200 text-cyan-700'
                  }`}
                >
                  View All 989 Cases →
                </button>
              </div>
            </div>

            <div className={`divide-y ${isDark ? 'divide-slate-800' : 'divide-slate-200'} max-h-96 overflow-y-auto`}>
              {filteredRecentCases.length === 0 ? (
                <div className="p-8 text-center text-slate-500 font-mono">
                  No cases matching current filter.
                </div>
              ) : (
                filteredRecentCases.map(c => {
                  const isPending = (c.status || '').toLowerCase().includes('pending');
                  const isSolved = (c.status || '').toLowerCase().includes('solved');
                  return (
                    <div
                      key={c.id}
                      onClick={() => { onSelectCase(c.id); setTab('case-graph'); }}
                      className={`p-4 flex flex-col md:flex-row md:items-center justify-between gap-3 ${
                        isDark ? 'hover:bg-slate-800/40' : 'hover:bg-slate-50'
                      } transition cursor-pointer select-none group`}
                    >
                      <div className="space-y-1">
                        <div className="flex items-center space-x-2">
                          <span className="font-bold text-cyan-500 group-hover:text-cyan-400 transition">{c.id}</span>
                          <span className="text-slate-400">•</span>
                          <span className={`font-sans font-semibold text-xs ${isDark ? 'text-white' : 'text-slate-900'}`}>{c.title}</span>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                            isPending
                              ? (isDark ? 'bg-amber-950 text-amber-300 border-amber-800' : 'bg-amber-100 text-amber-800 border-amber-300')
                              : isSolved
                                ? (isDark ? 'bg-emerald-950 text-emerald-300 border-emerald-800' : 'bg-emerald-100 text-emerald-800 border-emerald-300')
                                : (isDark ? 'bg-cyan-950 border-cyan-800 text-cyan-300' : 'bg-cyan-100 border-cyan-300 text-cyan-800')
                          }`}>
                            {c.status || 'Active'}
                          </span>
                        </div>
                        <div className={`text-[11px] ${textMuted}`}>
                          Agency: {c.department} • Suspects: {c.suspectsCount} • Evidence Refs: {c.evidenceCount} • Anomaly: {((c.maxAnomaly || 0.1) * 100).toFixed(0)}%
                        </div>
                      </div>

                      <div className="flex items-center space-x-2 shrink-0" onClick={e => e.stopPropagation()}>
                        <button
                          onClick={() => { onSelectCase(c.id); setTab('case-graph'); }}
                          className="px-3 py-1.5 bg-cyan-950 border border-cyan-800 hover:bg-cyan-900 text-cyan-300 rounded font-bold transition shadow"
                        >
                          Graph 🕸️
                        </button>
                        <button
                          onClick={() => { onSelectCase(c.id); setTab('timeline-map'); }}
                          className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded font-bold transition"
                        >
                          Route 🗺️
                        </button>
                        <button
                          onClick={() => { onSelectCase(c.id); setTab('intel-360'); }}
                          className="px-3 py-1.5 bg-purple-950 border border-purple-800 hover:bg-purple-900 text-purple-300 rounded font-bold transition"
                        >
                          360° 👤
                        </button>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>

          <ActiveCasesModal
            isOpen={isActiveCasesOpen}
            onClose={() => setIsActiveCasesOpen(false)}
            onSelectCase={onSelectCase}
            onSelectEntity={onSelectEntity}
            setTab={setTab}
            initialFilter={modalFilter}
          />

          <SuspectsModal
            isOpen={isSuspectsOpen}
            onClose={() => setIsSuspectsOpen(false)}
            onSelectEntity={onSelectEntity}
            setTab={setTab}
          />

          <RecordsModal
            isOpen={isRecordsOpen}
            onClose={() => setIsRecordsOpen(false)}
          />
        </div>
      );
    }

    function CleanCaseGraphView({ currentCaseId = 'C00228', onSelectCase, onSelectEntity, setTab, isDark }) {
      const [caseId, setCaseId] = useState(currentCaseId);
      const [searchQuery, setSearchQuery] = useState('');
      const [graphData, setGraphData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [selectedNode, setSelectedNode] = useState(null);
      const [filterType, setFilterType] = useState('ALL');
      const [positions, setPositions] = useState({});
      const [draggedNode, setDraggedNode] = useState(null);
      const [isEditMode, setIsEditMode] = useState(false);
      const [isAddNodeOpen, setIsAddNodeOpen] = useState(false);

      const [newNodeType, setNewNodeType] = useState('Suspect');
      const [newNodeId, setNewNodeId] = useState('');
      const [newNodeLabel, setNewNodeLabel] = useState('');
      const [newNodeSubLabel, setNewNodeSubLabel] = useState('');
      const [newNodeRole, setNewNodeRole] = useState('Co-Conspirator');
      const [newNodeAnomaly, setNewNodeAnomaly] = useState('0.75');

      const containerRef = useRef(null);

      const fetchGraph = (targetId) => {
        setLoading(true);
        fetch(`/api/intelligence/case-graph/${targetId}`)
          .then(r => r.json())
          .then(res => {
            if (res.success) {
              setGraphData(res);
              calculateRadialPositions(res.nodes);
              const center = res.nodes.find(n => n.isCenter);
              setSelectedNode(center || res.nodes[0]);
            }
            setLoading(false);
          })
          .catch(() => setLoading(false));
      };

      useEffect(() => {
        fetchGraph(caseId);
      }, [caseId]);

      const calculateRadialPositions = (nodes) => {
        const width = 850;
        const height = 550;
        const centerX = width / 2;
        const centerY = height / 2;
        const newPos = {};

        const centerNode = nodes.find(n => n.isCenter);
        if (centerNode) {
          newPos[centerNode.id] = { x: centerX, y: centerY };
        }

        const suspects = nodes.filter(n => n.type === 'Suspect');
        const members = nodes.filter(n => n.type === 'Member');
        const phones = nodes.filter(n => n.type === 'Phone');
        const accounts = nodes.filter(n => n.type === 'Account');
        const locations = nodes.filter(n => n.type === 'Location');
        const vehicles = nodes.filter(n => n.type === 'Vehicle');

        if (suspects.length > 0) {
          suspects.forEach((s, idx) => {
            const angle = (Math.PI * 1.5) + (idx * 0.4);
            newPos[s.id] = {
              x: centerX + Math.cos(angle) * 140,
              y: centerY + Math.sin(angle) * 140
            };
          });
        }

        const outerItems = [
          ...members.map(m => ({ item: m, ring: 250 })),
          ...phones.map(p => ({ item: p, ring: 220 })),
          ...accounts.map(a => ({ item: a, ring: 240 })),
          ...locations.map(l => ({ item: l, ring: 260 })),
          ...vehicles.map(v => ({ item: v, ring: 230 }))
        ];

        const totalOuter = outerItems.length;
        outerItems.forEach((entry, idx) => {
          const angle = (idx / (totalOuter || 1)) * Math.PI * 2;
          newPos[entry.item.id] = {
            x: centerX + Math.cos(angle) * entry.ring,
            y: centerY + Math.sin(angle) * entry.ring
          };
        });

        setPositions(newPos);
      };

      const handlePointerDown = (id, e) => {
        e.stopPropagation();
        setDraggedNode(id);
      };

      const handlePointerMove = (e) => {
        if (!draggedNode || !containerRef.current) return;
        const rect = containerRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        setPositions(prev => ({
          ...prev,
          [draggedNode]: { x, y }
        }));
      };

      const handlePointerUp = () => {
        setDraggedNode(null);
      };

      const handleAddNode = (e) => {
        e.preventDefault();
        if (!newNodeId || !newNodeLabel) return;

        fetch(`/api/intelligence/case-graph/${caseId}/node`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id: newNodeId,
            label: newNodeLabel,
            subLabel: newNodeSubLabel,
            type: newNodeType,
            role: newNodeRole,
            anomaly: newNodeAnomaly,
            relLabel: 'CUSTOM_LINK'
          })
        })
        .then(r => r.json())
        .then(() => {
          fetchGraph(caseId);
          setIsAddNodeOpen(false);
          setNewNodeId('');
          setNewNodeLabel('');
          setNewNodeSubLabel('');
        });
      };

      const handleDeleteNode = (nodeId) => {
        if (!confirm(`Are you sure you want to remove node ${nodeId} from this case graph?`)) return;
        fetch(`/api/intelligence/case-graph/${caseId}/node/${nodeId}`, {
          method: 'DELETE'
        })
        .then(r => r.json())
        .then(() => {
          fetchGraph(caseId);
          setSelectedNode(null);
        });
      };

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        let q = searchQuery.trim().toUpperCase();
        if (q) {
          if (!q.startsWith('C') && !isNaN(q)) {
            q = 'C' + q.padStart(5, '0');
          }
          setCaseId(q);
          onSelectCase && onSelectCase(q);
        }
      };

      const filteredNodes = graphData?.nodes.filter(n => {
        if (n.isCenter) return true;
        if (filterType === 'ALL') return true;
        return n.type === filterType;
      }) || [];

      const filteredEdges = graphData?.edges.filter(e => {
        const s = filteredNodes.some(n => n.id === e.source);
        const t = filteredNodes.some(n => n.id === e.target);
        return s && t;
      }) || [];

      return (
        <div className="p-6 space-y-4 max-w-7xl mx-auto font-sans">
          <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4 border-slate-700/60">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-xl">🕸️</span>
                <h1 className="text-xl font-black font-mono tracking-wide">
                  CASE FORENSIC NETWORK GRAPH (989 CASES CORPUS)
                </h1>
                <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-cyan-950 text-cyan-400 border border-cyan-800">
                  {isEditMode ? 'EDIT MODE ACTIVE ✏️' : 'VIEW MODE'}
                </span>
              </div>
              <p className="text-xs text-slate-400 mt-1 font-mono">
                Type ANY case number to generate its relational tree. Add or remove entities, edit attributes, and drag nodes.
              </p>
            </div>

            <div className="flex flex-wrap items-center gap-3">
              <form onSubmit={handleSearchSubmit} className="flex items-center space-x-2">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={e => setSearchQuery(e.target.value)}
                  placeholder="Enter Case # (e.g. C00228, C00104)..."
                  className="bg-slate-900 border border-slate-700 text-cyan-300 font-mono text-xs px-3 py-1.5 rounded-lg outline-none w-56"
                />
                <button
                  type="submit"
                  className="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white font-mono text-xs font-bold rounded-lg"
                >
                  Load
                </button>
              </form>

              <button
                onClick={() => setIsEditMode(!isEditMode)}
                className={`px-3 py-1.5 rounded-lg font-mono text-xs font-bold transition flex items-center space-x-1.5 ${
                  isEditMode ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                }`}
              >
                <span>✏️</span>
                <span>{isEditMode ? 'Exit Edit Mode' : 'Edit Graph'}</span>
              </button>

              {isEditMode && (
                <button
                  onClick={() => setIsAddNodeOpen(true)}
                  className="px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-mono text-xs font-bold rounded-lg shadow"
                >
                  + Add New Entity
                </button>
              )}
            </div>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/60 p-3 rounded-xl border border-slate-800 font-mono text-xs">
            <div className="flex flex-wrap items-center gap-2">
              <span className="text-slate-400 text-[11px] mr-1">FILTER:</span>
              {[
                { id: 'ALL', label: 'All' },
                { id: 'Suspect', label: 'Primary Suspect (Red)' },
                { id: 'Member', label: 'Syndicate (Orange)' },
                { id: 'Phone', label: 'Phones (Green)' },
                { id: 'Account', label: 'Bank Accounts (Gold)' },
                { id: 'Location', label: 'Locations (Purple)' },
                { id: 'Vehicle', label: 'Vehicles (Blue)' }
              ].map(f => (
                <button
                  key={f.id}
                  onClick={() => setFilterType(f.id)}
                  className={`px-2.5 py-1 rounded text-[11px] transition ${
                    filterType === f.id
                      ? 'bg-cyan-600 text-white font-bold'
                      : 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  {f.label}
                </button>
              ))}
            </div>

            <div className="text-[11px] text-slate-400">
              Active Case: <strong className="text-cyan-400">#{graphData?.caseId || caseId}</strong> ({graphData?.nodes?.length || 0} Entities Linked)
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-4 gap-4">
            <div
              ref={containerRef}
              onPointerMove={handlePointerMove}
              onPointerUp={handlePointerUp}
              className="lg:col-span-3 h-[560px] bg-[#070c18] border border-slate-800 rounded-2xl relative overflow-hidden select-none shadow-2xl"
            >
              <div className="absolute inset-0 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:24px_24px] opacity-40 pointer-events-none"></div>

              {loading && (
                <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-sm z-30 flex items-center justify-center font-mono text-xs text-cyan-400">
                  <span className="animate-spin mr-2">⚙️</span>
                  COMPUTING RELATIONSHIP GRAPH FOR CASE #{caseId}...
                </div>
              )}

              <svg className="w-full h-full pointer-events-none" viewBox="0 0 850 550">
                <defs>
                  <linearGradient id="caseLine" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.8" />
                    <stop offset="100%" stopColor="#ef4444" stopOpacity="0.6" />
                  </linearGradient>
                  <linearGradient id="genericLine" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#06b6d4" stopOpacity="0.4" />
                    <stop offset="100%" stopColor="#3b82f6" stopOpacity="0.3" />
                  </linearGradient>
                </defs>

                {filteredEdges.map(e => {
                  const p1 = positions[e.source];
                  const p2 = positions[e.target];
                  if (!p1 || !p2) return null;

                  const isPrimary = e.source === graphData?.caseId || e.target === graphData?.caseId;

                  return (
                    <g key={e.id}>
                      <line
                        x1={p1.x}
                        y1={p1.y}
                        x2={p2.x}
                        y2={p2.y}
                        stroke={isPrimary ? 'url(#caseLine)' : 'url(#genericLine)'}
                        strokeWidth={isPrimary ? '2.5' : '1.5'}
                        strokeDasharray={isPrimary ? '' : '3 3'}
                      />
                      <rect
                        x={(p1.x + p2.x) / 2 - 40}
                        y={(p1.y + p2.y) / 2 - 7}
                        width="80"
                        height="14"
                        fill="#0b1329"
                        rx="3"
                        opacity="0.85"
                      />
                      <text
                        x={(p1.x + p2.x) / 2}
                        y={(p1.y + p2.y) / 2 + 3}
                        fill="#94a3b8"
                        fontSize="8"
                        fontFamily="monospace"
                        textAnchor="middle"
                      >
                        {e.label}
                      </text>
                    </g>
                  );
                })}
              </svg>

              {filteredNodes.map(n => {
                const pos = positions[n.id] || { x: 425, y: 275 };
                const isCenter = n.isCenter;
                const isSelected = selectedNode?.id === n.id;

                if (isCenter) {
                  return (
                    <div
                      key={n.id}
                      onPointerDown={(e) => handlePointerDown(n.id, e)}
                      onClick={() => setSelectedNode(n)}
                      style={{ left: `${pos.x - 45}px`, top: `${pos.y - 45}px` }}
                      className={`absolute w-[90px] h-[90px] rounded-full border-4 flex flex-col items-center justify-center cursor-grab active:cursor-grabbing shadow-[0_0_30px_rgba(6,182,212,0.5)] transition-transform hover:scale-105 select-none z-20 bg-gradient-to-br from-cyan-950 via-slate-900 to-blue-950 ${
                        isSelected ? 'border-cyan-300 ring-4 ring-cyan-500/50' : 'border-cyan-500'
                      }`}
                    >
                      <img
                        src="/logo.png"
                        alt="Logo"
                        className="h-8 w-auto object-contain mb-0.5"
                        onError={(e) => { e.target.style.display = 'none'; }}
                      />
                      <span className="text-[10px] font-mono font-black text-cyan-300 tracking-wider">
                        {n.id}
                      </span>
                      <span className="text-[8px] font-mono text-slate-400 uppercase">
                        CASE FILE
                      </span>
                    </div>
                  );
                }

                let colorClasses = 'bg-blue-600 border-blue-400';
                let icon = '🔹';
                if (n.type === 'Suspect') {
                  colorClasses = 'bg-red-600 border-red-300 shadow-[0_0_15px_rgba(239,68,68,0.5)]';
                  icon = '👤';
                } else if (n.type === 'Member') {
                  colorClasses = 'bg-orange-600 border-orange-300';
                  icon = '👥';
                } else if (n.type === 'Phone') {
                  colorClasses = 'bg-emerald-600 border-emerald-300';
                  icon = '📱';
                } else if (n.type === 'Account') {
                  colorClasses = 'bg-amber-600 border-amber-300';
                  icon = '💳';
                } else if (n.type === 'Location') {
                  colorClasses = 'bg-purple-600 border-purple-300';
                  icon = '📍';
                } else if (n.type === 'Vehicle') {
                  colorClasses = 'bg-sky-600 border-sky-300';
                  icon = '🚗';
                }

                return (
                  <div
                    key={n.id}
                    onPointerDown={(e) => handlePointerDown(n.id, e)}
                    onClick={() => setSelectedNode(n)}
                    style={{ left: `${pos.x - 22}px`, top: `${pos.y - 22}px` }}
                    className={`absolute w-11 h-11 rounded-full border-2 flex items-center justify-center cursor-grab active:cursor-grabbing shadow-lg transition-transform hover:scale-110 select-none z-10 ${colorClasses} ${
                      isSelected ? 'ring-4 ring-white' : ''
                    }`}
                  >
                    <span className="text-sm">{icon}</span>
                    <span className="absolute -bottom-4 text-[9px] font-mono font-semibold text-slate-200 bg-slate-950/90 px-1 rounded truncate max-w-[90px] border border-slate-800">
                      {n.label}
                    </span>
                  </div>
                );
              })}
            </div>

            <div className="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 space-y-4 font-mono text-xs">
              <h3 className="font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-2 flex justify-between">
                <span>ENTITY DOSSIER</span>
                <span className="text-cyan-400">{selectedNode?.type || 'NODE'}</span>
              </h3>

              {selectedNode ? (
                <div className="space-y-3">
                  <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 space-y-1.5">
                    <span className="text-slate-500 text-[10px] block">IDENTIFIER</span>
                    <h4 className="text-base font-bold text-cyan-400">{selectedNode.id}</h4>
                    <p className="text-slate-200 font-sans text-xs">{selectedNode.label}</p>
                    {selectedNode.subLabel && (
                      <p className="text-[11px] text-slate-400">{selectedNode.subLabel}</p>
                    )}
                  </div>

                  {selectedNode.isCenter ? (
                    <div className="space-y-2 text-[11px]">
                      <div className="p-2 rounded bg-slate-950 border border-slate-800">
                        <span className="text-slate-500 block">Lead Department:</span>
                        <span className="text-white font-bold">{selectedNode.department}</span>
                      </div>
                      <div className="p-2 rounded bg-slate-950 border border-slate-800">
                        <span className="text-slate-500 block">Investigation Status:</span>
                        <span className="text-emerald-400 font-bold">{selectedNode.status || 'Active'}</span>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-2 text-[11px]">
                      {selectedNode.role && (
                        <div className="p-2 rounded bg-slate-950 border border-slate-800">
                          <span className="text-slate-500 block">Alleged Role:</span>
                          <span className="text-amber-400 font-bold">{selectedNode.role}</span>
                        </div>
                      )}
                      {selectedNode.anomaly && (
                        <div className="p-2 rounded bg-slate-950 border border-slate-800">
                          <span className="text-slate-500 block">Anomaly Risk Index:</span>

      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        fetch('/api/ai/status')
          .then(r => r.json())
          .then(d => {
            if (d.success) setAiStatus(d);
          })
          .catch(() => {
            setAiStatus({ configured: false, model: 'Local Analyzer', statusText: 'Local Offline Fallback' });

        `What burner SIMs and tower pings were recorded?`,
        `Recommend IPC & IT Act charge sheet sections`

        `Explain typical Hawala structuring methods across inter-state shell entities`,
        `Summary of Section 65B Indian Evidence Act certificate requirements`,
        `Common cyber crime indicators for unauthorized crypto off-ramps`
      ];

        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages]);

        const query = textToSend || inputMsg;
        if (!query.trim() || loading) return;

        const userMsg = { id: Date.now(), sender: 'user', text: query, mode: aiMode };
        setMessages(prev => [...prev, userMsg]);
        setInputMsg('');
        setLoading(true);

        const token = localStorage.getItem('netrish_token');
        const endpoint = aiMode === 'RESEARCH_ASSISTANT' ? '/api/ai/research' : '/api/ai/chat';
        const payload = aiMode === 'RESEARCH_ASSISTANT'
          ? { query }
          : { message: query, caseId, isResearch: false };

        fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          },
          body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(d => {
          if (d.success) {
            setMessages(prev => [
              ...prev,
              {
                id: Date.now() + 1,
                sender: 'ai',
                text: d.reply || d.answer || 'Response generated.',
                engine: d.engine,
                engineStatus: d.engineStatus,
                citations: d.citations || [],
                facts: d.facts || [],
                inferences: d.inferences || [],
                possible_leads: d.possible_leads || [],
                isGrounded: d.isGrounded,
                mode: aiMode
              }
            ]);
          } else {
            setMessages(prev => [
              ...prev,
              {
                id: Date.now() + 1,
                sender: 'ai',
                text: `Error: ${d.error || d.message || 'Investigation query rejected.'}`,
                isError: true,
                mode: aiMode
              }
            ]);
          }
          setLoading(false);
        })
        .catch(err => {
          setMessages(prev => [
            ...prev,
            {
              id: Date.now() + 1,
              sender: 'ai',
              text: `Network or Server Error: ${err.message}. Local rule-based analyzer active.`,
              isError: true,
              mode: aiMode
            }
          ]);
          setLoading(false);

        setIsLookingUp(true);
        setLookupError('');
        setLookupResult(null);

        const token = localStorage.getItem('netrish_token');
        fetch('/api/network/lookup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
          },
          body: JSON.stringify({ ip: lookupIp.trim() })

          .then(r => r.json())
          .then(d => {
            setIsLookingUp(false);
            if (d.success) {
              setLookupResult(d.data);
            } else {

          .then(d => { if (d.success) setDeptCases(d.cases); });

            id: newCaseId,
            title: newCaseTitle,
            department_id: currentDeptId,
            primaryAccused: { name: newAccusedName },
            lawSection: newLawSection,

              className="bg-slate-900 border border-slate-700 text-white font-mono text-xs px-3 py-1.5 rounded-lg outline-none w-64"
            />
          </div>

          <div className={`border rounded-2xl overflow-hidden shadow-xl ${cardBg}`}>
            <table className="w-full text-left text-xs font-mono">
              <thead className={`${isDark ? 'bg-[#0b1329] text-slate-400 border-slate-800' : 'bg-slate-100 text-slate-700 border-slate-200'} text-[11px] border-b uppercase`}>
                <tr>
                  <th className="p-3.5">Case ID</th>
                  <th className="p-3.5">Title & Department</th>
                  <th className="p-3.5">Status</th>
                  <th className="p-3.5">Suspects</th>
                  <th className="p-3.5">Risk Score</th>
                  <th className="p-3.5 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className={`divide-y ${isDark ? 'divide-slate-800/60' : 'divide-slate-200'}`}>
                {filtered.map(c => (
                  <tr key={c.id} className={`${isDark ? 'hover:bg-slate-800/40' : 'hover:bg-slate-50'} transition`}>
                    <td className="p-3.5 font-bold text-cyan-500">{c.id}</td>
                    <td className="p-3.5 font-sans">
                      <div className="font-semibold">{c.title}</div>
                      <div className="text-[10px] text-slate-400 font-mono">{c.department_name}</div>
                    </td>
                    <td className="p-3.5">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] border ${isDark ? 'border-slate-700 bg-slate-900 text-slate-300' : 'border-slate-300 bg-slate-100 text-slate-700'}`}>
                        {c.status}
                      </span>
                    </td>
                    <td className="p-3.5">{c.persons_count} suspects</td>
                    <td className="p-3.5 font-bold text-red-500">{(c.max_anomaly * 100).toFixed(0)}%</td>
                    <td className="p-3.5 text-right space-x-2">
                      <button
                        onClick={() => { onSelectCase(c.id); setTab('case-graph'); }}
                        className="px-2.5 py-1 bg-cyan-950 border border-cyan-800 text-cyan-300 rounded text-[11px]"
                      >
                        Graph 🕸️
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function AccessRequestsView({ onRequestNew, isDark }) {
      const [requests, setRequests] = useState([]);

      const fetchRequests = () => {
        fetch('/api/erp/access-requests')
          .then(r => r.json())
          .then(d => { if (d.success) setRequests(d.requests); });
      };

      useEffect(() => {
        fetchRequests();
      }, []);

      const handleApprove = (id) => {
        fetch(`/api/erp/access-requests/${id}/approve`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ officer: { id: 'ADMIN-007', name: 'SP Neha Sharma' } })
        }).then(() => fetchRequests());
      };

      const handleRevoke = (id) => {
        fetch(`/api/erp/access-requests/${id}/revoke`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ officer: { id: 'ADMIN-007', name: 'SP Neha Sharma' } })
        }).then(() => fetchRequests());
      };

      const cardBg = isDark ? 'bg-slate-900/80 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900 shadow-sm';

      return (
        <div className="p-6 space-y-6 max-w-7xl mx-auto font-sans">
          <div className="border-b pb-4 border-slate-700/60 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-xl">🔑</span>
                <h1 className="text-xl font-black font-mono tracking-wide">
                  TEMPORARY ACCESS CONTROL & PERMISSION QUEUE
                </h1>
              </div>
              <p className="text-xs text-slate-400 mt-1 font-mono">
                Cross-Department Time-Bound Clearance Records with Surveillance Logging.
              </p>
            </div>
            <button
              onClick={onRequestNew}
              className="px-4 py-2 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-mono text-xs font-bold rounded-lg shadow-lg"
            >
              + SUBMIT NEW CROSS-DEPT REQUEST
            </button>
          </div>

          <div className={`border rounded-2xl overflow-hidden shadow-xl ${cardBg} font-mono text-xs`}>
            <table className="w-full text-left">
              <thead className={`${isDark ? 'bg-[#0b1329] text-slate-400 border-slate-800' : 'bg-slate-100 text-slate-700 border-slate-200'} text-[11px] border-b uppercase`}>
                <tr>
                  <th className="p-3.5">Request ID</th>
                  <th className="p-3.5">Officer & Agency</th>
                  <th className="p-3.5">Target Case & Dept</th>
                  <th className="p-3.5">Suspect Identifier</th>
                  <th className="p-3.5">Duration</th>
                  <th className="p-3.5">Status</th>
                  <th className="p-3.5 text-right">Actions</th>
                </tr>
              </thead>
              <tbody className={`divide-y ${isDark ? 'divide-slate-800/60' : 'divide-slate-200'}`}>
                {requests.map(r => (
                  <tr key={r.id} className={`${isDark ? 'hover:bg-slate-800/40' : 'hover:bg-slate-50'} transition`}>
                    <td className="p-3.5 font-bold text-cyan-500">{r.id}</td>
                    <td className="p-3.5">
                      <div className="font-bold">{r.requestingOfficer}</div>
                      <div className="text-[10px] text-slate-400">{r.fromDeptName} (Badge: {r.badge || 'N/A'})</div>
                    </td>
                    <td className="p-3.5">
                      <div className="text-amber-500 font-bold">{r.caseId}</div>
                      <div className="text-[10px] text-slate-400">{r.targetDeptName}</div>
                    </td>
                    <td className="p-3.5 max-w-xs truncate">
                      {r.suspectIdentifier}
                    </td>
                    <td className="p-3.5 text-slate-400">{r.durationMins || 60} Mins</td>
                    <td className="p-3.5">
                      <span className={`px-2 py-0.5 rounded-full text-[10px] border ${
                        r.status === 'ACTIVE_STREAMING' || r.status === 'APPROVED'
                          ? 'bg-emerald-950 border-emerald-600 text-emerald-300'
                          : r.status === 'REVOKED'
                          ? 'bg-red-950 border-red-800 text-red-300'
                          : 'bg-amber-950 border-amber-800 text-amber-300'
                      }`}>
                        {r.status}
                      </span>
                    </td>
                    <td className="p-3.5 text-right space-x-2">
                      {r.status === 'PENDING' && (
                        <button
                          onClick={() => handleApprove(r.id)}
                          className="px-2.5 py-1 bg-emerald-700 hover:bg-emerald-600 text-white rounded text-[11px]"
                        >
                          Approve & Stream
                        </button>
                      )}
                      {(r.status === 'ACTIVE_STREAMING' || r.status === 'APPROVED') && (
                        <button
                          onClick={() => handleRevoke(r.id)}
                          className="px-2.5 py-1 bg-red-800 hover:bg-red-700 text-white rounded text-[11px]"
                        >
                          Revoke
                        </button>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    function RequestAccessModal({ isOpen, onClose, initialData = {} }) {
      const [targetDept, setTargetDept] = useState(initialData.targetDept || 'GST Intelligence (DGGI)');
      const [caseId, setCaseId] = useState(initialData.caseId || 'C00228');
      const [suspectIdentifier, setSuspectIdentifier] = useState('Aadhaar: 4921-8842-1092 / Phone: +91 98210-1000');
      const [purpose, setPurpose] = useState('Cross-checking shell firm GSTIN ITC credits against Hawala money laundering trail in FIR 44/2026.');
      const [durationMins, setDurationMins] = useState('60');
      const [badge, setBadge] = useState('CBI-SP-041');

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        fetch('/api/erp/access-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            targetDepartment: targetDept,
            caseId,
            suspectIdentifier,
            purpose,
            durationMins,
            badge,
            officer: {
              name: 'Inspector Vikram Rathore',
              id: 'OFFICER-001',
              department: 'D002'
            }
          })
        }).then(() => {
          onClose();
        });
      };

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
          <div className="max-w-lg w-full bg-[#0b1329] border border-cyan-500/40 rounded-2xl p-6 shadow-2xl text-white font-mono text-xs space-y-4">
            <div className="flex justify-between items-center border-b border-slate-700 pb-3">
              <div className="flex items-center space-x-2">
                <span className="text-xl">🔑</span>
                <h3 className="font-bold text-sm">REQUEST TEMPORARY INTER-AGENCY ACCESS</h3>
              </div>
              <button onClick={onClose} className="text-slate-400 hover:text-white">✕</button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3">
              <div>
                <label className="block text-slate-400 mb-1">TARGET DEPARTMENT</label>
                <select
                  value={targetDept}
                  onChange={e => setTargetDept(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-cyan-300 outline-none"
                >
                  <option value="GST Intelligence (DGGI)">GST Intelligence (DGGI)</option>
                  <option value="Enforcement Directorate (ED)">Enforcement Directorate (ED)</option>
                  <option value="Income Tax (DGIT Investigation)">Income Tax (DGIT Investigation)</option>
                  <option value="Narcotics Control Bureau (NCB)">Narcotics Control Bureau (NCB)</option>
                  <option value="National Investigation Agency (NIA)">National Investigation Agency (NIA)</option>
                  <option value="Cyber Crime Cell (I4C)">Cyber Crime Cell (I4C)</option>
                </select>
              </div>

              <div>
                <label className="block text-slate-400 mb-1">TARGET CASE FILE ID</label>
                <input
                  type="text"
                  value={caseId}
                  onChange={e => setCaseId(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white outline-none"
                />
              </div>

              <div>
                <label className="block text-slate-400 mb-1">TARGET SUSPECT IDENTIFIER (Aadhaar / Phone / Vehicle)</label>
                <input
                  type="text"
                  value={suspectIdentifier}
                  onChange={e => setSuspectIdentifier(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white outline-none"
                />
              </div>

              <div>
                <label className="block text-slate-400 mb-1">LEGAL JUSTIFICATION & PURPOSE</label>
                <textarea
                  value={purpose}
                  onChange={e => setPurpose(e.target.value)}
                  rows="2"
                  className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white outline-none"
                ></textarea>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-slate-400 mb-1">REQUESTED DURATION</label>
                  <select
                    value={durationMins}
                    onChange={e => setDurationMins(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white outline-none"
                  >
                    <option value="15">15 Minutes</option>
                    <option value="30">30 Minutes</option>
                    <option value="60">1 Hour (Standard)</option>
                    <option value="120">2 Hours (Special)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-slate-400 mb-1">OFFICER BADGE ID</label>
                  <input
                    type="text"
                    value={badge}
                    onChange={e => setBadge(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-white outline-none"
                  />
                </div>
              </div>

              <button
                type="submit"
                className="w-full py-3 bg-gradient-to-r from-cyan-600 to-blue-600 text-white font-bold rounded-xl uppercase tracking-wider"
              >
                SUBMIT CLEARANCE REQUEST ➔
              </button>
            </form>
          </div>
        </div>
      );
    }

    function App() {
      const savedTheme = localStorage.getItem('netrish_theme') || 'dark';
      const [isDark, setIsDark] = useState(savedTheme === 'dark');
      const [isLanding, setIsLanding] = useState(true);
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [currentUser, setCurrentUser] = useState(null);
      const [isAuthOpen, setIsAuthOpen] = useState(false);
      const [authModalInitialTab, setAuthModalInitialTab] = useState('LOGIN');
      const [isRequestModalOpen, setIsRequestModalOpen] = useState(false);
      const [requestModalData, setRequestModalData] = useState({});
      const [selectedCaseId, setSelectedCaseId] = useState('C00228');
      const [selectedEntityId, setSelectedEntityId] = useState('P0732');

      useEffect(() => {
        document.documentElement.classList.toggle('dark', isDark);
        localStorage.setItem('netrish_theme', isDark ? 'dark' : 'light');
      }, [isDark]);

      useEffect(() => {
        const savedToken = localStorage.getItem('netrish_token');
        if (savedToken) {
          fetch('/api/auth/session', {
            headers: { 'Authorization': `Bearer ${savedToken}` }
          })
            .then(r => r.json())
            .then(d => {
              if (d.success && d.user) {
                setCurrentUser(d.user);
                setIsLanding(false);
              } else {
                localStorage.removeItem('netrish_token');
                localStorage.removeItem('netrish_user');
                setCurrentUser(null);
                setIsLanding(true);
              }
            })
            .catch(() => {
              setIsLanding(true);
            });
        }
      }, []);

      const toggleTheme = () => {
        setIsDark(!isDark);
      };

      const handleOpenRequestAccess = (data = {}) => {
        setRequestModalData(data);
        setIsRequestModalOpen(true);
      };

      const handleLoginSuccess = (user, token) => {
        setCurrentUser(user);
        if (token) {
          localStorage.setItem('netrish_token', token);
          localStorage.setItem('netrish_user', JSON.stringify(user));
        }
        setIsLanding(false);
      };

      const handleLogout = () => {
        const token = localStorage.getItem('netrish_token');
        if (token) {
          fetch('/api/auth/logout', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
          }).catch(() => {});
        }
        localStorage.removeItem('netrish_token');
        localStorage.removeItem('netrish_user');
        setCurrentUser(null);
        setIsLanding(true);
      };

      const handleOpenAuth = (initialTab = 'LOGIN') => {
        setAuthModalInitialTab(initialTab);
        setIsAuthOpen(true);
      };

      if (isLanding) {
        return (
          <>
            <LandingPage
              isAuthenticated={Boolean(currentUser)}
              onAutoEnter={() => {
                if (currentUser) setIsLanding(false);
                else handleOpenAuth('LOGIN');
              }}
              onOpenAuth={handleOpenAuth}
            />
            <AuthModal
              isOpen={isAuthOpen}
              initialTab={authModalInitialTab}
              onClose={() => setIsAuthOpen(false)}
              onLoginSuccess={handleLoginSuccess}
            />
          </>
        );
      }

      const renderView = () => {
        switch (currentTab) {
          case 'case-graph':
            return (
              <CleanCaseGraphView
                currentCaseId={selectedCaseId}
                onSelectCase={(id) => setSelectedCaseId(id)}
                onSelectEntity={(id) => setSelectedEntityId(id)}
                setTab={setCurrentTab}
                isDark={isDark}
              />
            );
          case 'biometric-search':
            return (
              <BiometricSearchView
                currentUser={currentUser}
                onSelectCase={(id) => setSelectedCaseId(id)}
                onSelectEntity={(id) => setSelectedEntityId(id)}
                setTab={setCurrentTab}
                isDark={isDark}
              />
            );
          case 'timeline-map':
            return (
              <TimelineTraceMapView
                caseId={selectedCaseId}
                isDark={isDark}
              />
            );
          case 'my-department':
            return (
              <MyDepartmentView
                onRequestAccess={handleOpenRequestAccess}
                onSelectCase={(id) => setSelectedCaseId(id)}
                setTab={setCurrentTab}
                isDark={isDark}
              />
            );
          case 'network-monitor':
          case 'surveillance-room':
            return <NetworkCameraSecurityMonitorView isDark={isDark} currentUser={currentUser} setTab={setCurrentTab} />;
          case 'ai-investigation':
            return <AiInvestigationChatbotView isDark={isDark} />;
          case 'cross-case':
            return <CrossCaseAnalysisView isDark={isDark} />;
          case 'erp-access':
            return <AccessRequestsView onRequestNew={() => handleOpenRequestAccess({})} isDark={isDark} />;
          case 'erp-cases':
            return (
              <CasesDirectoryView
                onSelectCase={(id) => setSelectedCaseId(id)}
                setTab={setCurrentTab}
                isDark={isDark}
              />
            );
          case 'intel-360':
            return (
              <Entity360View
                entityId={selectedEntityId}
                onSelectCase={(id) => setSelectedCaseId(id)}
                setTab={setCurrentTab}
                isDark={isDark}
              />
            );
          case 'erp-audit':
            return (
              <SimpleView title="TAMPER-PROOF AUDIT TRAIL (SHA-256 HASH CHAIN)" icon="🔗" isDark={isDark}>
                <div className="p-5 bg-slate-900 border border-slate-800 rounded-xl font-mono text-xs space-y-3">
                  <div className="text-cyan-400 font-bold">CRYPTOGRAPHIC BLOCKCHAIN AUDIT LOG:</div>
                  <div className="p-3 bg-slate-950 rounded border border-slate-800 text-[11px] text-slate-300 space-y-1">
                    <div>Genesis Hash: <code className="text-slate-400">e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855</code></div>
                    <div>Latest Block: <code className="text-cyan-400">4f89d01b9a823e421098efcc23a01726a9f8b4172810a9cb8912ef3918a201b1</code></div>
                    <div className="text-emerald-400 font-bold mt-1">Status: Hash Chain Verified • Zero Tamper Detected</div>
                  </div>
                </div>
              </SimpleView>
            );
          case 'settings':
            return (
              <SystemSettingsView
                isDark={isDark}
                toggleTheme={toggleTheme}
                currentUser={currentUser}
              />
            );
          case 'dashboard':
          default:
            return (
              <DashboardView
                setTab={setCurrentTab}
                onSelectCase={(id) => setSelectedCaseId(id)}
                onSelectEntity={(id) => setSelectedEntityId(id)}
                isDark={isDark}
              />
            );
        }
      };

      return (
        <div className={`min-h-screen flex flex-col font-sans ${isDark ? 'bg-[#060913] text-slate-100' : 'bg-slate-100 text-slate-900'}`}>
          <Navbar
            currentUser={currentUser}
            onLogout={handleLogout}
            onOpenAuth={() => handleOpenAuth('LOGIN')}
            isDark={isDark}
            toggleTheme={toggleTheme}
          />

          <div className="flex flex-1 overflow-hidden">
            <Sidebar currentTab={currentTab} setTab={setCurrentTab} isDark={isDark} />
            <main className="flex-1 overflow-y-auto h-[calc(100vh-4rem)]">
              {renderView()}
            </main>
          </div>

          <AuthModal
            isOpen={isAuthOpen}
            initialTab={authModalInitialTab}
            onClose={() => setIsAuthOpen(false)}
            onLoginSuccess={handleLoginSuccess}
          />

          <RequestAccessModal
            isOpen={isRequestModalOpen}
            onClose={() => setIsRequestModalOpen(false)}
            initialData={requestModalData}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
