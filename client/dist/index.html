<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NETRISH | National Entity Tracking, Relationship, Investigation & Secure Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      transition: background-color 0.2s, color 0.2s;
    }
    .dark body {
      background-color: #060913;
      color: #f8fafc;
    }
    body:not(.dark) {
      background-color: #f1f5f9;
      color: #0f172a;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.4); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #06b6d4; }

    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .orbit-spin-cw {
      animation: spinClockwise 10s linear infinite;
      transform-origin: center;
    }
    .orbit-spin-ccw {
      animation: spinCounter 7s linear infinite;
      transform-origin: center;
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(0.96); }
      50% { opacity: 0.7; transform: scale(1.04); }
    }
    .pulse-glow {
      animation: pulseGlow 2.5s ease-in-out infinite;
    }
    @keyframes laserSweep {
      0% { top: 0%; opacity: 0.8; }
      50% { top: 100%; opacity: 1; }
      100% { top: 0%; opacity: 0.8; }
    }
    .laser-line {
      animation: laserSweep 2s ease-in-out infinite;
    }
    .watermark-overlay {
      background-image: repeating-linear-gradient(
        -45deg,
        rgba(239, 68, 68, 0.05),
        rgba(239, 68, 68, 0.05) 120px,
        rgba(6, 182, 212, 0.05) 120px,
        rgba(6, 182, 212, 0.05) 240px
      );
    }
    .leaflet-container {
      width: 100%;
      height: 100%;
      background: #090e1c !important;
    }

    /* COMPREHENSIVE LIGHT / DARK ACCESSIBILITY THEME & TYPOGRAPHY */
    html:not(.dark) {
      color-scheme: light;
    }
    html:not(.dark) body {
      background-color: #f1f5f9;
      color: #0f172a;
    }
    html:not(.dark) .bg-slate-950,
    html:not(.dark) .bg-slate-900,
    html:not(.dark) .bg-gray-900,
    html:not(.dark) .bg-zinc-900,
    html:not(.dark) .bg-black {
      background-color: #ffffff !important;
      color: #0f172a;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .bg-slate-900\/50,
    html:not(.dark) .bg-slate-900\/60,
    html:not(.dark) .bg-slate-900\/80,
    html:not(.dark) .bg-slate-900\/90,
    html:not(.dark) .bg-slate-950\/60,
    html:not(.dark) .bg-slate-950\/80,
    html:not(.dark) .bg-slate-950\/90 {
      background-color: rgba(255, 255, 255, 0.95) !important;
      color: #0f172a;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .bg-slate-800,
    html:not(.dark) .bg-slate-850 {
      background-color: #f8fafc !important;
      color: #1e293b;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .hover\:bg-slate-800:hover,
    html:not(.dark) .hover\:bg-slate-700:hover {
      background-color: #e2e8f0 !important;
      color: #0f172a;
    }
    html:not(.dark) .text-white,
    html:not(.dark) .text-slate-100,
    html:not(.dark) .text-slate-200 {
      color: #0f172a !important;
    }
    html:not(.dark) .text-slate-300 {
      color: #1e293b !important;
    }
    html:not(.dark) .text-slate-400 {
      color: #334155 !important;
    }
    html:not(.dark) .text-slate-500 {
      color: #475569 !important;
    }
    html:not(.dark) .border-slate-800,
    html:not(.dark) .border-slate-700,
    html:not(.dark) .border-slate-600 {
      border-color: #cbd5e1 !important;
    }
    html:not(.dark) input,
    html:not(.dark) select,
    html:not(.dark) textarea {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    html:not(.dark) input::placeholder,
    html:not(.dark) textarea::placeholder {
      color: #64748b !important;
    }
    html:not(.dark) th {
      background-color: #f8fafc !important;
      color: #334155 !important;
      border-color: #e2e8f0 !important;
    }
    html:not(.dark) .text-cyan-400,
    html:not(.dark) .text-cyan-300 {
      color: #0891b2 !important;
    }
    html:not(.dark) .text-amber-400,
    html:not(.dark) .text-amber-300 {
      color: #d97706 !important;
    }
    html:not(.dark) .text-emerald-400,
    html:not(.dark) .text-emerald-300 {
      color: #059669 !important;
    }
    html:not(.dark) .text-red-400,
    html:not(.dark) .text-red-300 {
      color: #dc2626 !important;
    }
    html:not(.dark) .leaflet-container {
      background: #f8fafc !important;
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const INDIAN_AGENCIES = [
      { id: 'D001', name: 'Cyber Crime Cell (I4C)', fullName: 'Indian Cybercrime Coordination Centre', badge: 'Digital Fraud & Darknet' },
      { id: 'D002', name: 'CBI (Central Bureau of Investigation)', fullName: 'Central Bureau of Investigation', badge: 'Special Crime & Anti-Corruption' },
      { id: 'D003', name: 'CID (Crime Investigation Department)', fullName: 'Crime Investigation Department', badge: 'State Crime Branch & Homicide' },
      { id: 'D004', name: 'ED (Enforcement Directorate)', fullName: 'Enforcement Directorate', badge: 'PMLA & FEMA Money Laundering' },
      { id: 'D005', name: 'Income Tax (DGIT Investigation)', fullName: 'Directorate General of Income Tax (Inv)', badge: 'Tax Evasion & Undisclosed Assets' },
      { id: 'D006', name: 'GST Intelligence (DGGI)', fullName: 'DGGI (Directorate General of GST Intel)', badge: 'Fake ITC Invoicing & Hawala Chains' },
      { id: 'D007', name: 'NCB (Narcotics Control Bureau)', fullName: 'Narcotics Control Bureau', badge: 'International Cartels & NDPS' },
      { id: 'D008', name: 'NIA (National Investigation Agency)', fullName: 'National Investigation Agency', badge: 'Counter-Terrorism & Security' },
      { id: 'D009', name: 'DRI (Directorate of Revenue Intelligence)', fullName: 'Directorate of Revenue Intelligence', badge: 'Customs & Port Smuggling' }
    ];

    function LandingPage({ onAutoEnter, onOpenAuth, isAuthenticated }) {
      const [now, setNow] = useState(new Date());
      const [loadingSpeed, setLoadingSpeed] = useState(15);
      const [locationStr, setLocationStr] = useState('New Delhi, India (HQ Grid: 28.6139° N, 77.2090° E)');

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              setLocationStr(`Lat: ${pos.coords.latitude.toFixed(4)}° N, Long: ${pos.coords.longitude.toFixed(4)}° E (Verified Node)`);
            },
            () => {
              setLocationStr('New Delhi, India (HQ Command Grid: 28.6139° N, 77.2090° E)');
            }
          );
        }
      }, []);

      useEffect(() => {
        const interval = setInterval(() => {
          setLoadingSpeed(prev => {
            const inc = Math.floor(Math.random() * 8) + 6;
            const next = Math.min(100, prev + inc);
            if (next >= 100) {
              clearInterval(interval);
              if (isAuthenticated) {
                setTimeout(() => onAutoEnter(), 400);
              }
            }
            return next;
          });
        }, 90);
        return () => clearInterval(interval);
      }, [onAutoEnter, isAuthenticated]);

      const dayStr = now.toLocaleDateString('en-IN', { weekday: 'long' });
      const dateStr = now.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
      const timeStr = now.toLocaleTimeString('en-IN', { hour12: true });

      const circumference = 2 * Math.PI * 130;
      const strokeDashoffset = circumference - (loadingSpeed / 100) * circumference;

      return (
        <div className="min-h-screen bg-[#040711] text-white flex flex-col justify-between relative overflow-hidden select-none">
          <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(6,182,212,0.12),transparent_70%)] pointer-events-none"></div>

          <header className="px-6 sm:px-12 py-5 flex items-center justify-between relative z-20">
            <div className="flex items-center space-x-2">
              <span className="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-ping"></span>
              <span className="font-mono text-xs tracking-widest text-cyan-400 font-bold uppercase">
                NETRISH MAINFRAME
              </span>
            </div>

            <div className="flex flex-col sm:flex-row items-end sm:items-center gap-2 sm:gap-4 font-mono text-xs">
              <div className="flex items-center space-x-1.5 px-3 py-1 rounded-lg border border-slate-800 bg-[#090f20]/90 text-cyan-300">
                <span>📍</span>
                <span className="text-[11px] truncate max-w-xs">{locationStr}</span>
              </div>

              <div className="flex items-center space-x-2.5 px-3.5 py-1.5 rounded-lg border border-slate-800 bg-[#090f20]/90 shadow-lg">
                <span className="text-white font-bold">{dayStr}, {dateStr}</span>
                <span className="text-slate-600">|</span>
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-cyan-400 font-bold">{timeStr} IST</span>
              </div>
            </div>
          </header>

          <main className="relative z-10 flex flex-col items-center justify-center my-auto px-6 space-y-6">
            <div className="text-center space-y-1.5 font-mono">
              <h1 className="text-3xl sm:text-5xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-sky-200 to-blue-400">
                NETRISH
              </h1>
              <p className="text-xs sm:text-sm text-cyan-300 font-semibold tracking-wide uppercase max-w-xl mx-auto">
                NATIONAL ENTITY TRACKING, RELATIONSHIP, INVESTIGATION & SECURE HUB
              </p>
            </div>

            <div className="relative w-72 h-72 sm:w-88 sm:h-88 flex items-center justify-center cursor-pointer" onClick={() => { if (isAuthenticated) onAutoEnter(); else onOpenAuth('LOGIN'); }}>
              <div className="absolute inset-0 rounded-full bg-cyan-500/10 blur-3xl pulse-glow pointer-events-none"></div>

              <svg className="w-full h-full transform -rotate-90" viewBox="0 0 300 300">
                <circle
                  cx="150"
                  cy="150"
                  r="130"
                  fill="none"
                  stroke="#1e293b"
                  strokeWidth="6"
                  strokeOpacity="0.4"
                />
                <circle
                  cx="150"
                  cy="150"
                  r="130"
                  fill="none"
                  stroke="url(#progressGrad)"
                  strokeWidth="6"
                  strokeDasharray={circumference}
                  strokeDashoffset={strokeDashoffset}
                  strokeLinecap="round"
                  className="transition-all duration-150 ease-out"
                />

                <circle
                  cx="150"
                  cy="150"
                  r="142"
                  fill="none"
                  stroke="#06b6d4"
                  strokeWidth="1.5"
                  strokeDasharray="6 8"
                  strokeOpacity="0.6"
                  className="orbit-spin-cw"
                />
                <circle
                  cx="150"
                  cy="150"
                  r="116"
                  fill="none"
                  stroke="#3b82f6"
                  strokeWidth="1"
                  strokeDasharray="4 6"
                  strokeOpacity="0.5"
                  className="orbit-spin-ccw"
                />

                <defs>
                  <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#06b6d4" />
                    <stop offset="50%" stopColor="#3b82f6" />
                    <stop offset="100%" stopColor="#8b5cf6" />
                  </linearGradient>
                </defs>
              </svg>

              <div className="absolute w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-[#080d1e] border border-cyan-500/30 flex flex-col items-center justify-center p-6 shadow-[0_0_50px_rgba(6,182,212,0.25)] hover:scale-105 transition-transform duration-300">
                <img
                  src="/logo.png"
                  alt="NETRISH Logo"
                  className="h-24 sm:h-28 w-auto object-contain drop-shadow-[0_0_20px_rgba(6,182,212,0.5)]"
                  onError={(e) => { e.target.style.display = 'none'; }}
                />
              </div>
            </div>

            <div className="text-center space-y-3 font-mono">
              <div className="inline-block px-4 py-1.5 rounded-full border border-cyan-500/40 bg-cyan-950/60 text-cyan-300 font-bold tracking-widest text-xs uppercase shadow">
                SECURE INTELLIGENCE HUB
              </div>
              <div className="text-xs text-slate-400">
                Boot Progress: <strong className="text-white">{loadingSpeed}%</strong> • {loadingSpeed < 100 ? 'Synchronizing Encryption Enclave...' : 'Enclave Online • Restricted Law Enforcement Access'}
              </div>
              {loadingSpeed >= 100 && (
                <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
                  <button
                    onClick={() => onOpenAuth('LOGIN')}
                    className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-mono font-bold text-xs uppercase tracking-wider shadow-[0_0_20px_rgba(6,182,212,0.4)] transition transform hover:scale-105"
                  >
                    🔑 OFFICER SECURE LOGIN
                  </button>
                  <button
                    onClick={() => onOpenAuth('SIGNUP')}
                    className="px-6 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-cyan-300 border border-slate-700 font-mono font-bold text-xs uppercase tracking-wider transition"
                  >
                    📝 NEW ENROLLMENT
                  </button>
                </div>
              )}
            </div>
          </main>

          <footer className="px-6 py-4 border-t border-slate-900 bg-[#060a14]/60 text-[11px] font-mono text-slate-500 flex flex-col sm:flex-row items-center justify-between gap-2 z-10">
            <div>
              <span>NETRISH • NATIONAL ENTITY TRACKING, RELATIONSHIP, INVESTIGATION & SECURE HUB</span>
            </div>
            <div className="text-slate-400">
              LAW ENFORCEMENT OPERATIONAL PLATFORM
            </div>
          </footer>
        </div>
      );
    }

    function Navbar({ currentUser, onLogout, onOpenAuth, isDark, toggleTheme }) {
      const [now, setNow] = useState(new Date());

      useEffect(() => {
        const timer = setInterval(() => setNow(new Date()), 1000);
        return () => clearInterval(timer);
      }, []);

      const dayStr = now.toLocaleDateString('en-IN', { weekday: 'short' });
      const dateStr = now.toLocaleDateString('en-IN', {
        day: '2-digit',
        month: 'short',
        year: 'numeric'
      });
      const timeStr = now.toLocaleTimeString('en-IN', { hour12: true });

      return (
        <header className={`h-16 border-b px-6 flex items-center justify-between z-30 sticky top-0 shadow-md backdrop-blur-md ${
          isDark ? 'bg-[#080d1a]/95 border-slate-800 text-white' : 'bg-white/95 border-slate-200 text-slate-900'
        }`}>
          <div className="flex items-center space-x-3">
            <img
              src="/logo.png"
              alt="NETRISH Logo"
              onError={(e) => { e.target.style.display = 'none'; }}
              className="h-9 w-auto object-contain rounded"
            />
            <div>
              <div className="flex items-center space-x-2">
                <span className="font-extrabold tracking-wider text-base font-mono">NETRISH</span>
                <span className="bg-cyan-950/80 border border-cyan-500/50 text-cyan-400 text-[10px] font-mono px-2 py-0.5 rounded-full uppercase">
                  INVESTIGATION HUB
                </span>
              </div>
              <p className={`text-[10px] tracking-tight hidden sm:block ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>
                National Entity Tracking, Relationship, Investigation & Secure Hub
              </p>
            </div>
          </div>

          <div className="flex items-center space-x-4 text-xs font-mono">
            <div className={`hidden md:flex items-center space-x-3 px-3.5 py-1.5 rounded-lg border ${
              isDark ? 'bg-slate-900/80 border-slate-800 text-slate-200' : 'bg-slate-100 border-slate-300 text-slate-800'
            }`}>
              <div className="flex items-center space-x-1.5">
                <span className="text-cyan-500">📅</span>
                <span className="font-bold">{dayStr}, {dateStr}</span>
              </div>
              <span className="text-slate-400">|</span>
              <div className="flex items-center space-x-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span className="text-cyan-500 font-bold">{timeStr}</span>
                <span className="text-slate-400 text-[10px]">IST</span>
              </div>
            </div>

            <button
              onClick={toggleTheme}
              className={`p-2 rounded-lg border text-xs font-mono transition ${
                isDark ? 'bg-slate-900 border-slate-800 text-slate-300 hover:text-cyan-400' : 'bg-slate-100 border-slate-300 text-slate-700 hover:text-cyan-600'
              }`}
            >
              {isDark ? '🌙 Dark Mode' : '☀️ Light Mode'}
            </button>

            {currentUser ? (
              <div className={`flex items-center space-x-2.5 px-3 py-1.5 rounded-lg border ${
                isDark ? 'bg-slate-900 border-slate-800 text-white' : 'bg-slate-100 border-slate-300 text-slate-900'
              }`}>
                <div className="w-7 h-7 rounded-full bg-cyan-600 text-white flex items-center justify-center font-bold text-xs">
                  {currentUser.name?.slice(0, 2) || 'OF'}
                </div>
                <div className="text-left hidden lg:block">
                  <div className="text-xs font-bold leading-tight">{currentUser.name}</div>
                  <div className="text-[10px] text-cyan-500 font-mono leading-tight">{currentUser.id} • {currentUser.role}</div>
                </div>
                <button
                  onClick={onLogout}
                  className="text-xs bg-red-950/60 hover:bg-red-900 text-red-300 border border-red-800 px-2 py-0.5 rounded font-mono"
                >
                  Logout
                </button>
              </div>
            ) : (
              <button
                onClick={onOpenAuth}
                className="bg-gradient-to-r from-cyan-600 to-blue-600 text-white text-xs font-bold font-mono px-3.5 py-2 rounded-lg shadow-md"
              >
                OFFICER LOGIN / SIGNUP
              </button>
            )}
          </div>
        </header>
      );
    }

    function Sidebar({ currentTab, setTab, isDark }) {
      const coreItems = [
        { id: 'dashboard', label: 'Command Dashboard', icon: '🧭' },
        { id: 'case-graph', label: 'Case Network Graph', icon: '🕸️', badge: 'EDITABLE' },
        { id: 'biometric-search', label: 'Biometric Search (NAFIS)', icon: '🧬', badge: 'SCANNER' },
        { id: 'timeline-map', label: 'Timeline Trace (Map)', icon: '🗺️', badge: 'GOOGLE MAP' },
        { id: 'erp-cases', label: 'Case Directory', icon: '📁' },
        { id: 'intel-360', label: 'Entity 360° Dossier', icon: '👤' }
      ];

      const collabItems = [
        { id: 'my-department', label: 'My Department (Grid)', icon: '🏛️', badge: 'REGISTER FIR' },
        { id: 'network-monitor', label: 'Network & Camera Security Monitor', icon: '📡', badge: 'IP & CAM' },
        { id: 'erp-access', label: 'Access Requests', icon: '🔑' }
      ];

      const aiItems = [
        { id: 'ai-investigation', label: 'AI Investigation Chatbot', icon: '🤖', badge: 'COPILOT' },
        { id: 'cross-case', label: 'Cross-Case Analysis', icon: '🔄', badge: 'RELATIONS' },
        { id: 'erp-audit', label: 'Tamper Audit Chain (SHA-256)', icon: '🔗' },
        { id: 'settings', label: 'System Settings', icon: '⚙️' }
      ];

      const activeClass = isDark
        ? 'bg-slate-800 text-cyan-400 font-bold border-l-2 border-cyan-400'
        : 'bg-cyan-50 text-cyan-800 font-bold border-l-2 border-cyan-600';
      const inactiveClass = isDark
        ? 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
        : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900';

      return (
        <aside className={`w-64 border-r flex flex-col h-[calc(100vh-4rem)] overflow-y-auto shrink-0 select-none ${
          isDark ? 'bg-[#070b16] border-slate-800' : 'bg-white border-slate-200'
        }`}>
          <div className="p-4 space-y-6">
            <div>
              <div className="text-[11px] uppercase font-mono tracking-wider text-cyan-500 font-bold px-3 mb-2 flex justify-between">
                <span>INVESTIGATION CORE</span>
                <span className="text-[9px] bg-cyan-950 text-cyan-400 px-1.5 py-0.5 rounded">HUB</span>
              </div>
              <div className="space-y-1">
                {coreItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-md text-xs transition ${
                      currentTab === item.id ? activeClass : inactiveClass
                    }`}
                  >
                    <div className="flex items-center space-x-2.5 truncate">
                      <span className="text-sm">{item.icon}</span>
                      <span className="truncate">{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className="text-[9px] font-mono px-1.5 py-0.2 rounded bg-cyan-950 text-cyan-400 border border-cyan-800">
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <div className="text-[11px] uppercase font-mono tracking-wider text-amber-500 font-bold px-3 mb-2 flex justify-between">
                <span>INTER-AGENCY & WATCH</span>
                <span className="text-[9px] bg-amber-950 text-amber-300 px-1.5 py-0.5 rounded">UNIT</span>
              </div>
              <div className="space-y-1">
                {collabItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-md text-xs transition ${
                      currentTab === item.id ? activeClass : inactiveClass
                    }`}
                  >
                    <div className="flex items-center space-x-2.5 truncate">
                      <span className="text-sm">{item.icon}</span>
                      <span className="truncate">{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className="text-[9px] font-mono px-1.5 py-0.2 rounded bg-red-950 text-red-400 border border-red-800 animate-pulse">
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </div>
            </div>

            <div>
              <div className="text-[11px] uppercase font-mono tracking-wider text-purple-500 font-bold px-3 mb-2">
                AI REASONER & AUDIT
              </div>
              <div className="space-y-1">
                {aiItems.map(item => (
                  <button
                    key={item.id}
                    onClick={() => setTab(item.id)}
                    className={`w-full flex items-center justify-between px-3 py-2 rounded-md text-xs transition ${
                      currentTab === item.id ? activeClass : inactiveClass
                    }`}
                  >
                    <div className="flex items-center space-x-2.5 truncate">
                      <span className="text-sm">{item.icon}</span>
                      <span className="truncate">{item.label}</span>
                    </div>
                    {item.badge && (
                      <span className="text-[9px] font-mono px-1.5 py-0.2 rounded bg-purple-950 text-purple-300 border border-purple-800">
                        {item.badge}
                      </span>
                    )}
                  </button>
                ))}
              </div>
            </div>
          </div>

          <div className={`mt-auto p-4 border-t text-[10px] font-mono ${
            isDark ? 'border-slate-800 bg-[#060a14] text-slate-500' : 'border-slate-200 bg-slate-50 text-slate-600'
          }`}>
            <div>NETRISH SECURE MAINFRAME</div>
            <div className="text-cyan-500 mt-0.5">NATIONAL INVESTIGATION GRID</div>
          </div>
        </aside>
      );
    }

    function BiometricSearchView({ onSelectCase, onSelectEntity, setTab, isDark, currentUser }) {
      const [activeSubTab, setActiveSubTab] = useState('FACE'); // 'FACE' | 'FINGERPRINT' | 'HISTORY'
      const [fingerName, setFingerName] = useState('RIGHT_THUMB');
      const [caseIdInput, setCaseIdInput] = useState('TEST-CASE-101');
      const [testRecords, setTestRecords] = useState([]);
      
      // Upload & selection state
      const [selectedFilename, setSelectedFilename] = useState('');
      const [previewDataUrl, setPreviewDataUrl] = useState(null);
      const [isScanning, setIsScanning] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');
      
      // Result & History state
      const [searchResult, setSearchResult] = useState(null);
      const [searchHistory, setSearchHistory] = useState([]);
      const [selectedCandidateModal, setSelectedCandidateModal] = useState(null);
      const [selectedHistoryModal, setSelectedHistoryModal] = useState(null);

      const effectiveOfficerId = currentUser?.id || 'OFFICER-001';

      // Load synthetic test records from backend
      useEffect(() => {
        fetch('/api/biometric/test-records', {
          headers: { 'X-Officer-Id': effectiveOfficerId }
        })
          .then(r => r.json())
          .then(d => {
            if (d.success && Array.isArray(d.records)) {
              setTestRecords(d.records);
            }
          })
          .catch(() => {});
      }, [effectiveOfficerId]);

      // Fetch search history
      const loadHistory = () => {
        fetch('/api/biometric/history', {
          headers: { 'X-Officer-Id': effectiveOfficerId }
        })
          .then(r => r.json())
          .then(d => {
            if (d.success) setSearchHistory(d.history || []);
          })
          .catch(() => {});
      };

      useEffect(() => {
        if (activeSubTab === 'HISTORY') {
          loadHistory();
        }
      }, [activeSubTab]);

      // File selection handler
      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        setErrorMessage('');
        setSelectedFilename(file.name);

        const reader = new FileReader();
        reader.onload = (loadEvt) => {
          setPreviewDataUrl(loadEvt.target.result);
        };
        reader.readAsDataURL(file);
      };

      // Select preset test probe from synthetic dataset
      const handleSelectTestProbe = (record, type) => {
        setErrorMessage('');
        setSearchResult(null);
        if (type === 'FACE') {
          const probePath = record.face_probe_image;
          const probeName = probePath.split('/').pop();
          setSelectedFilename(probeName);
          setPreviewDataUrl(`/api/biometric/image?path=${encodeURIComponent(probePath)}`);
          setCaseIdInput(record.case_id);
        } else {
          const probePath = record.fingerprint_probe_image;
          const probeName = probePath.split('/').pop();
          setSelectedFilename(probeName);
          setPreviewDataUrl(`/api/biometric/image?path=${encodeURIComponent(probePath)}`);
          setFingerName(record.finger_name || 'RIGHT_THUMB');
          setCaseIdInput(record.case_id);
        }
      };

      // Select unknown probe for test no-match scenario
      const handleSelectUnknownProbe = (type) => {
        setErrorMessage('');
        setSearchResult(null);
        if (type === 'FACE') {
          setSelectedFilename('unknown_unregistered_suspect_face.png');
          setPreviewDataUrl('https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200');
        } else {
          setSelectedFilename('unknown_latent_crime_scene_print.png');
          setPreviewDataUrl('https://images.unsplash.com/photo-1544717305-2782549b5136?w=200');
        }
      };

      // Execute search
      const handleRunSearch = async () => {
        if (!selectedFilename && !previewDataUrl) {
          setErrorMessage('Please select or upload a biometric probe image first.');
          return;
        }

        setIsScanning(true);
        setErrorMessage('');
        setSearchResult(null);

        const endpoint = activeSubTab === 'FACE' ? '/api/biometric/search/face' : '/api/biometric/search/fingerprint';
        const payload = {
          filename: selectedFilename || (activeSubTab === 'FACE' ? 'face_probe.png' : 'fp_probe.png'),
          fileBase64: previewDataUrl?.startsWith('data:') ? previewDataUrl : null,
          caseId: caseIdInput.trim() || 'TEST-CASE-101',
          fingerName: activeSubTab === 'FINGERPRINT' ? fingerName : undefined
        };

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Officer-Id': effectiveOfficerId
            },
            body: JSON.stringify(payload)
          });

          const data = await res.json();
          setTimeout(() => {
            setIsScanning(false);
            if (!data.success && data.error) {
              setErrorMessage(data.error);
            } else {
              setSearchResult(data);
            }
          }, 800);
        } catch (err) {
          setIsScanning(false);
          setErrorMessage(err.message || 'Biometric search request failed');
        }
      };

      // View Candidate Details Modal & Audit
      const handleOpenCandidateDetails = (candidate) => {
        setSelectedCandidateModal(candidate);
        // Log view event
        fetch('/api/biometric/audit/view-result', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Officer-Id': effectiveOfficerId
          },
          body: JSON.stringify({
            candidateId: candidate.id,
            subjectId: candidate.subjectId,
            caseId: candidate.caseId
          })
        }).catch(() => {});
      };

      const cardBg = isDark ? 'bg-slate-900/80 border-slate-800 text-slate-100' : 'bg-white border-slate-200 text-slate-900 shadow-sm';
      const innerBg = isDark ? 'bg-slate-950 border-slate-800' : 'bg-slate-50 border-slate-200';

      return (
        <div className="p-6 space-y-6 max-w-7xl mx-auto font-sans">
          {/* Header & Title */}
          <div className="border-b pb-4 border-slate-700/60 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center space-x-2">
                <span className="text-2xl">🧬</span>
                <h1 className="text-xl font-black font-mono tracking-wide">
                  BIOMETRIC SEARCH & IDENTIFICATION WORKFLOW
                </h1>
              </div>
              <p className="text-xs text-slate-400 mt-1 font-mono">
                Multimodal facial vector & latent fingerprint matching engine for cross-agency criminal investigation.
              </p>
            </div>

            {/* Test Mode Disclosure Badge */}
            <div className="flex items-center space-x-2 px-3 py-1.5 rounded-lg border border-amber-500/40 bg-amber-950/40 text-amber-300 font-mono text-xs shadow">
              <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
              <span className="font-bold uppercase tracking-wider">TEST MODE • SYNTHETIC BIOMETRIC DATA</span>
            </div>
          </div>

          {/* Test Notice Banner */}
          <div className="p-3.5 rounded-xl border border-cyan-500/30 bg-cyan-950/20 text-cyan-300 text-xs font-mono flex items-start space-x-2.5">
            <span className="text-base">ℹ️</span>
            <div>
              <strong className="text-white">SYNTHETIC BENCHMARK DATASET ACTIVE:</strong> All enrolled and probe samples are artificial test patterns designed exclusively for NETRISH workflow and pipeline validation. Not real criminal records.
            </div>
          </div>

          {/* Navigation Tabs */}
          <div className="flex border-b border-slate-800 font-mono text-xs space-x-2">
            <button
              onClick={() => { setActiveSubTab('FACE'); setSearchResult(null); setErrorMessage(''); }}
              className={`px-5 py-2.5 font-bold rounded-t-lg transition border-t-2 ${
                activeSubTab === 'FACE'
                  ? 'border-cyan-500 bg-cyan-950/40 text-cyan-300 border-l border-r border-slate-800'
                  : 'border-transparent text-slate-400 hover:text-white'
              }`}
            >
              👤 FACE SEARCH
            </button>
            <button
              onClick={() => { setActiveSubTab('FINGERPRINT'); setSearchResult(null); setErrorMessage(''); }}
              className={`px-5 py-2.5 font-bold rounded-t-lg transition border-t-2 ${
                activeSubTab === 'FINGERPRINT'
                  ? 'border-cyan-500 bg-cyan-950/40 text-cyan-300 border-l border-r border-slate-800'
                  : 'border-transparent text-slate-400 hover:text-white'
              }`}
            >
              👆 FINGERPRINT SEARCH
            </button>
            <button
              onClick={() => { setActiveSubTab('HISTORY'); }}
              className={`px-5 py-2.5 font-bold rounded-t-lg transition border-t-2 ${
                activeSubTab === 'HISTORY'
                  ? 'border-cyan-500 bg-cyan-950/40 text-cyan-300 border-l border-r border-slate-800'
                  : 'border-transparent text-slate-400 hover:text-white'
              }`}
            >
              📜 SEARCH HISTORY
            </button>
          </div>

          {/* Error Banner */}
          {errorMessage && (
            <div className="p-3.5 rounded-xl border border-red-500/50 bg-red-950/50 text-red-300 text-xs font-mono flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <span>⚠️</span>
                <span>{errorMessage}</span>
              </div>
              <button onClick={() => setErrorMessage('')} className="text-red-400 hover:text-white font-bold">✕</button>
            </div>
          )}

          {/* TAB 1 & 2: SEARCH WORKFLOW */}
          {activeSubTab !== 'HISTORY' && (
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              {/* LEFT COLUMN: UPLOAD & INPUT */}
              <div className={`p-6 rounded-2xl border ${cardBg} space-y-5`}>
                <div className="flex justify-between items-center">
                  <h3 className="font-mono text-xs font-bold uppercase tracking-wider text-cyan-400">
                    {activeSubTab === 'FACE' ? 'UPLOAD FACE PROBE' : 'UPLOAD FINGERPRINT PROBE'}
                  </h3>
                  <span className="text-[10px] font-mono text-slate-400">
                    MIME: PNG / JPG / WEBP (Max 5MB)
                  </span>
                </div>

                {/* Upload Area / Dropzone */}
                <div className="border border-dashed rounded-xl border-cyan-500/40 p-4 bg-[#050914] flex flex-col items-center justify-center relative overflow-hidden min-h-[220px]">
                  {previewDataUrl ? (
                    <div className="relative flex flex-col items-center">
                      <div className="relative border-2 border-cyan-500/60 rounded-lg p-1 bg-black/60 shadow-lg max-h-40 overflow-hidden">
                        <img
                          src={previewDataUrl}
                          alt="Probe Preview"
                          className="h-36 w-auto object-contain rounded"
                        />
                        {isScanning && (
                          <div className="absolute inset-0 bg-cyan-500/20 flex items-center justify-center pointer-events-none">
                            <div className="w-full h-1 bg-cyan-400 shadow-[0_0_15px_#06b6d4] animate-pulse"></div>
                          </div>
                        )}
                      </div>
                      <span className="font-mono text-[11px] text-cyan-300 mt-2 truncate max-w-xs">
                        {selectedFilename || 'probe_image.png'}
                      </span>
                    </div>
                  ) : (
                    <div className="flex flex-col items-center justify-center text-center space-y-2 py-4">
                      <span className="text-5xl select-none">{activeSubTab === 'FACE' ? '👤' : '👆'}</span>
                      <p className="font-mono text-xs text-slate-300 font-bold">
                        {activeSubTab === 'FACE' ? 'Upload Face Image Probe' : 'Upload Latent Fingerprint'}
                      </p>
                      <p className="text-[11px] text-slate-400 font-mono">
                        Select a file from device or choose a synthetic benchmark probe below
                      </p>
                    </div>
                  )}

                  <div className="mt-4">
                    <label className="cursor-pointer px-4 py-2 rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white font-mono text-xs font-bold shadow transition flex items-center space-x-2">
                      <span>📁</span>
                      <span>CHOOSE FILE</span>
                      <input
                        type="file"
                        accept="image/png,image/jpeg,image/webp"
                        onChange={handleFileChange}
                        className="hidden"
                      />
                    </label>
                  </div>
                </div>

                {/* Finger Selector (Fingerprint tab only) */}
                {activeSubTab === 'FINGERPRINT' && (
                  <div className="space-y-1.5 font-mono text-xs">
                    <label className="text-slate-400 block font-bold">FINGERPRINT POSITION:</label>
                    <select
                      value={fingerName}
                      onChange={e => setFingerName(e.target.value)}
                      className={`w-full p-2.5 rounded-lg border text-xs font-mono font-bold ${
                        isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'
                      }`}
                    >
                      <option value="RIGHT_THUMB">Right Thumb (NAFIS Default)</option>
                      <option value="LEFT_THUMB">Left Thumb</option>
                      <option value="RIGHT_INDEX">Right Index Finger</option>
                      <option value="LEFT_INDEX">Left Index Finger</option>
                    </select>
                  </div>
                )}

                {/* Case ID Linker */}
                <div className="space-y-1.5 font-mono text-xs">
                  <label className="text-slate-400 block font-bold">LINK INVESTIGATION CASE ID:</label>
                  <input
                    type="text"
                    value={caseIdInput}
                    onChange={e => setCaseIdInput(e.target.value)}
                    placeholder="e.g. TEST-CASE-101 or C00228"
                    className={`w-full p-2.5 rounded-lg border text-xs font-mono ${
                      isDark ? 'bg-slate-950 border-slate-700 text-white' : 'bg-white border-slate-300 text-slate-900'
                    }`}
                  />
                </div>

                {/* Search Button */}
                <button
                  onClick={handleRunSearch}
                  disabled={isScanning}
                  className="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-600 via-sky-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-mono font-bold text-sm shadow-lg flex items-center justify-center space-x-2 transition disabled:opacity-50"
                >
                  {isScanning ? (
                    <>
                      <span className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                      <span>COMPARING SYNTHETIC VECTORS...</span>
                    </>
                  ) : (
                    <>
                      <span>🔍</span>
                      <span>RUN BIOMETRIC SEARCH</span>
                    </>
                  )}
                </button>

                {/* Quick Synthetic Probe Presets */}
                <div className="pt-2 border-t border-slate-800 space-y-2 font-mono text-xs">
                  <span className="text-slate-400 text-[11px] font-bold block uppercase">
                    SYNTHETIC TEST PROBE PRESETS:
                  </span>
                  <div className="grid grid-cols-2 gap-2 max-h-36 overflow-y-auto pr-1">
                    {testRecords.map(r => (
                      <button
                        key={r.subject_id}
                        type="button"
                        onClick={() => handleSelectTestProbe(r, activeSubTab)}
                        className={`p-2 rounded-lg border text-left text-[11px] transition ${
                          selectedFilename.includes(r.subject_id)
                            ? 'border-cyan-500 bg-cyan-950/40 text-cyan-300 font-bold'
                            : 'border-slate-800 bg-slate-950/60 hover:border-slate-700 text-slate-300'
                        }`}
                      >
                        <div className="truncate">{r.display_name}</div>
                        <div className="text-[10px] text-cyan-400 mt-0.5">{r.subject_id}</div>
                      </button>
                    ))}
                    {/* Explicit No-Match Option */}
                    <button
                      type="button"
                      onClick={() => handleSelectUnknownProbe(activeSubTab)}
                      className="p-2 rounded-lg border border-red-900/60 bg-red-950/20 hover:border-red-600 text-left text-[11px] transition text-red-300"
                    >
                      <div className="font-bold">❌ Unknown Probe</div>
                      <div className="text-[10px] text-red-400">Test No-Match Found</div>
                    </button>
                  </div>
                </div>
              </div>

              {/* RIGHT COLUMN: SEARCH RESULT */}
              <div className={`p-6 rounded-2xl border ${cardBg} space-y-5 flex flex-col`}>
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-mono text-xs font-bold uppercase tracking-wider text-emerald-400">
                    BIOMETRIC SEARCH RESULT
                  </h3>
                  <span className="px-2 py-0.5 rounded text-[10px] font-mono bg-cyan-950 border border-cyan-800 text-cyan-300 font-bold">
                    TEST MODE
                  </span>
                </div>

                {searchResult ? (
                  searchResult.matchFound && searchResult.candidates?.length > 0 ? (
                    // MATCH FOUND VIEW
                    (() => {
                      const candidate = searchResult.candidates[0];
                      return (
                        <div className="space-y-4 font-mono text-xs">
                          {/* Match Banner */}
                          <div className="p-3.5 rounded-xl border border-emerald-500/40 bg-emerald-950/40 text-emerald-300 flex items-center justify-between">
                            <div className="flex items-center space-x-2">
                              <span className="text-xl">✅</span>
                              <div>
                                <div className="font-bold text-sm">CANDIDATE IDENTIFIED: {candidate.matchLabel}</div>
                                <div className="text-[11px] text-emerald-400">Score: {(candidate.similarityScore * 100).toFixed(1)}% (Test Calibration)</div>
                              </div>
                            </div>
                            <span className="px-2 py-1 rounded bg-emerald-900/80 text-emerald-200 text-[10px] font-bold">
                              {candidate.mode}
                            </span>
                          </div>

                          {/* Candidate Card */}
                          <div className={`p-4 rounded-xl border ${innerBg} space-y-3`}>
                            <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                              <div>
                                <span className="text-slate-400 text-[10px] uppercase block">Candidate Name</span>
                                <h4 className="text-base font-bold text-white">{candidate.displayName}</h4>
                              </div>
                              <div className="text-right">
                                <span className="text-slate-400 text-[10px] uppercase block">Subject ID</span>
                                <span className="text-cyan-400 font-bold">{candidate.subjectId}</span>
                              </div>
                            </div>

                            <div className="grid grid-cols-2 gap-3 text-[11px]">
                              <div>
                                <span className="text-slate-400 text-[10px] block">Linked Case</span>
                                <span className="text-white font-bold">{candidate.caseId}</span>
                              </div>
                              <div>
                                <span className="text-slate-400 text-[10px] block">Biometric Type</span>
                                <span className="text-cyan-300 font-bold">{searchResult.biometricType} {candidate.fingerName ? `(${candidate.fingerName})` : ''}</span>
                              </div>
                              <div className="col-span-2">
                                <span className="text-slate-400 text-[10px] block">Dataset Source</span>
                                <span className="text-slate-300">{candidate.dataset}</span>
                              </div>
                            </div>

                            {/* Probe vs Enrolled Template Comparison */}
                            <div className="pt-2 border-t border-slate-800">
                              <span className="text-slate-400 text-[10px] uppercase block mb-2 font-bold">
                                TEMPLATE COMPARISON (PROBE vs ENROLLED):
                              </span>
                              <div className="grid grid-cols-2 gap-3 text-center">
                                <div className="p-2 rounded-lg bg-black/40 border border-slate-800">
                                  <div className="text-[10px] text-slate-400 mb-1">Uploaded Probe</div>
                                  <img
                                    src={candidate.probeImagePath || previewDataUrl}
                                    alt="Probe"
                                    className="h-20 w-auto mx-auto object-contain rounded"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                  />
                                </div>
                                <div className="p-2 rounded-lg bg-black/40 border border-emerald-900/60">
                                  <div className="text-[10px] text-emerald-400 mb-1">Enrolled Template</div>
                                  <img
                                    src={candidate.enrolledImagePath}
                                    alt="Enrolled"
                                    className="h-20 w-auto mx-auto object-contain rounded"
                                    onError={(e) => { e.target.style.display = 'none'; }}
                                  />
                                </div>
                              </div>
                            </div>
                          </div>

                          {/* 3 Action Buttons */}
                          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-2">
                            <button
                              onClick={() => {
                                onSelectEntity(candidate.subjectId);
                                setTab('intel-360');
                              }}
                              className="py-2.5 px-3 rounded-lg bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold text-center shadow transition"
                            >
                              👤 View Entity
                            </button>
                            <button
                              onClick={() => {
                                onSelectCase(candidate.caseId);
                                setTab('case-graph');
                              }}
                              className="py-2.5 px-3 rounded-lg bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-center shadow transition"
                            >
                              🕸️ View Case
                            </button>
                            <button
                              onClick={() => handleOpenCandidateDetails(candidate)}
                              className="py-2.5 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-bold text-center transition"
                            >
                              📋 View Details
                            </button>
                          </div>
                        </div>
                      );
                    })()
                  ) : (
